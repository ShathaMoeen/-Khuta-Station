<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KHUTA · AI Evaluation (Development)</title><style>:root{color-scheme:dark;font:16px system-ui;background:#101a18;color:#eef5ef}body{max-width:1100px;margin:0 auto;padding:28px}h1{color:#bce6c7}.badge{border:1px solid #d69d52;color:#f0c47b;padding:4px 9px;border-radius:12px}.panel{background:#172522;border:1px solid #30423b;border-radius:14px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#0e1715;padding:12px;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#d8e9dd}.muted{color:#a9bbb0}a{color:#bce6c7}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}body{padding:16px}}</style></head><body>
<p><span class="badge">DEVELOPMENT ONLY</span></p><h1>KHUTA AI Evaluation</h1><p class="muted">Metrics are reported only when calculated from executed cases. Missing-provider metrics remain NOT_AVAILABLE.</p><section class="panel"><h2>Baseline metrics</h2><div id="metrics" class="grid">Loading…</div><p id="status" class="muted"></p></section><section class="panel"><h2>Failed cases</h2><pre id="failures">Loading…</pre></section><p><a href="/ai-playground">AI Playground</a> · <a href="/docs">API docs</a></p><script>
(async()=>{try{const r=await fetch('/dev/evaluation-results');if(!r.ok)throw Error(`Backend ${r.status}`);const d=await r.json();const metrics=d.metrics||{};document.getElementById('metrics').replaceChildren();for(const [k,v] of Object.entries(metrics)){const el=document.createElement('div');el.className='metric';const b=document.createElement('b');b.textContent=k.replaceAll('_',' ');const p=document.createElement('div');p.textContent=typeof v==='object'?JSON.stringify(v):String(v);el.append(b,p);document.getElementById('metrics').append(el)}document.getElementById('status').textContent=`Status: ${d.status||'unknown'} · Cases: ${d.total_tests??'NOT_AVAILABLE'} · Updated: ${d.generated_at||'not run'}`;document.getElementById('failures').textContent=JSON.stringify(d.failed_cases||[],null,2)}catch(e){document.getElementById('status').textContent=`Evaluation unavailable: ${e.message}`;document.getElementById('failures').textContent='No baseline result file yet.'}})();</script></body></html>
